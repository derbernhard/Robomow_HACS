# Robomow MC500 -- Lovelace card for the robomow_bridge integration.
#
# Entity names come from the integration's translations, so this card only
# adds the icon and (where it reads better on a narrow card) a short label.
#
# The four driving buttons use custom:button-card (install it via HACS)
# because they need a hold action with repeat. Replace them with plain
# "type: button" cards if you do not want that dependency.
type: vertical-stack
cards:
  - type: entities
    title: Robomow MC500
    show_header_toggle: false
    state_color: true
    entities:
      - entity: switch.robomow_ble
        icon: mdi:bluetooth
      - entity: sensor.robomow_battery
        icon: mdi:battery-medium
      - entity: sensor.robomow_status
        icon: mdi:mower
      - entity: sensor.robomow_current_zone
        icon: mdi:texture
      - entity: sensor.robomow_last_stop_reason
        icon: mdi:stop-circle-outline
      - entity: sensor.robomow_time_left
        icon: mdi:timer-outline
      - entity: sensor.robomow_next_start
        icon: mdi:skip-next-circle-outline
      - entity: sensor.robomow_moisture
        icon: mdi:water-outline
      - entity: sensor.robomow_percentage_cut
        icon: mdi:grass
      - entity: sensor.robomow_schedule_mode
        icon: mdi:calendar
      - entity: sensor.robomow_rssi
        icon: mdi:wifi
      - entity: switch.robomow_weekly_schedule
        icon: mdi:calendar-check
      - entity: binary_sensor.robomow_schedule_disabled_by_rain
        icon: mdi:weather-pouring
  - type: horizontal-stack
    cards:
      - show_name: true
        show_icon: true
        type: button
        icon: mdi:shape-rectangle-plus
        name: Kante mähen
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.robomow_mow_edge
      - show_name: true
        show_icon: true
        type: button
        icon: mdi:checkbox-intermediate-variant
        name: Zone wechseln
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.robomow_change_zone
      - show_name: true
        show_icon: true
        type: button
        icon: mdi:texture-box
        name: Fläche mähen
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.robomow_mow_area
  - type: horizontal-stack
    cards:
      - show_name: true
        show_icon: true
        type: button
        icon: mdi:home-variant-outline
        name: Home
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.robomow_go_home
      - show_name: true
        show_icon: true
        type: custom:button-card
        icon: mdi:arrow-up-bold-box
        name: vor
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.robomow_forward
        hold_action:
          action: perform-action
          perform_action: button.press
          repeat: 1000
          target:
            entity_id: button.robomow_forward
      - show_name: true
        show_icon: true
        type: button
        icon: mdi:stop-circle-outline
        name: Stop
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.robomow_stop
        hold_action:
          action: perform-action
          perform_action: homeassistant.update_entity
          target:
            entity_id:
              - sensor.robomow_status
              - sensor.robomow_last_stop_reason
  - type: horizontal-stack
    cards:
      - show_name: true
        show_icon: true
        type: custom:button-card
        icon: mdi:arrow-left-bold-box
        name: links
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.robomow_left
        hold_action:
          action: perform-action
          perform_action: button.press
          repeat: 1000
          target:
            entity_id: button.robomow_left
      - show_name: true
        show_icon: true
        type: custom:button-card
        icon: mdi:arrow-down-bold-box
        name: zurück
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.robomow_backward
        hold_action:
          action: perform-action
          perform_action: button.press
          repeat: 1000
          target:
            entity_id: button.robomow_backward
      - show_name: true
        show_icon: true
        type: custom:button-card
        icon: mdi:arrow-right-bold-box
        name: rechts
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.robomow_right
        hold_action:
          action: perform-action
          perform_action: button.press
          repeat: 1000
          target:
            entity_id: button.robomow_right
  # On-demand payloads -- these fetch /renewtelem and /oncemisc.
  # Diagnostics, so only keep the block if you actually poke at them.
  - type: entities
    title: Diagnose
    show_header_toggle: false
    entities:
      - entity: button.robomow_refresh_telemetry
        icon: mdi:battery-heart-variant
      - entity: button.robomow_refresh_events
        icon: mdi:history
      - entity: sensor.robomow_serial_number
        icon: mdi:identifier
